<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Skillline - Online learning made easy</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <!-- wrapper -->
    <div class="wrapper">
      <!-- hewader -->
      <header>
        <!-- nav -->

          <a href="/"
          class="logo-container">
            <img src="./images/logo-image.png" alt="Skillline Loho" />

          <!--Nav items-->
          <ul>

        </nav>

      <main>
