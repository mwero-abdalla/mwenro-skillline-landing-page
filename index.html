<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillline - Online learning made easy</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <!-- wrapper -->
    <div class="wrapper">
      <!-- hewader -->
      <header>
        <!-- nav -->
        <nav>
          <!-- logo -->
          <a href="/" class="logo-container">
            <img src="./images/logo-image.png" alt="Skillline Loho" />
            <span>Skillline</span>
          </a>

          <!--Nav items-->
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="#">Careers</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">About Us</a></li>
            <!-- auth navs -->
            <li class="auth-btn-group">
              <a href="#" class="btn-login">Login</a>
              <a href="#" class="btn-signup">Sign Up</a>
            </li>
          </ul>
        </nav>
      </header>
      <!-- main -->
      <main>
        <!-- hero section -->
        <section class="hero-section">
          <!-- hero-text -->
          <div class="hero-text">
            <h1><span>Studying</span> Online is now <br />much easier</h1>
            <p>
              <span>Skilline</span> is an interesting platform that will teach
              you in more an interactive way
            </p>
            <div class="hero-btn-group">
              <button class="pri-cta-btn">Join for free</button>
              <button class="sec-cta-btn">
                <div >
                  <img src="./images/hero-cta-play-btn.png" alt="play btn" />
                </div>
                <span>Watch how it works</span>
              </button>
            </div>
          </div>
          <!-- hero-image -->
          <div class="hero-image">
            <img src="./images/hero-image.png" alt="Hero Image" />
          </div>
        </section>

        <!-- company -->
        <section class="company-section">
          <h2>Trusted by 5,000+ Companies Worldwide</h2>
        <div class="logos-list">
          
        </div>
        </section>

        <!-- all-in-one -->
        <section class="all-in-one"></section>

        <!--  -->
      </main>
      <!-- footer -->
      <footer></footer>
    </div>
  </body>
</html>
